<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Life Calculator</title>
  
  <!-- טעינת ספריות ליבה -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap');
    body {
      margin: 0;
      background-color: #4B3FCF;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const C = {
      bg: "#4B3FCF",
      surface: "#5A4EE0",
      raised: "#6C5FF0",
      border: "#7B6FF5",
      text: "#FFFFFF",
      muted: "#D4CFFF",
      blue: "#3FD1FF",
      amber: "#FF7A45",
      green: "#2FE0A0",
      red: "#FF5C7A",
    };

    function Button({ children, onClick, variant = "primary" }) {
      const styles = {
        primary: { background: C.blue, color: "#fff" },
        amber: { background: C.amber, color: "#1A1200" },
        ghost: { background: "transparent", color: C.text, border: `1px solid ${C.border}` }
      };
      return (
        <button 
          onClick={onClick} 
          style={{ padding: "12px 24px", borderRadius: 12, border: "none", cursor: "pointer", fontWeight: 600, fontSize: 15, ...styles[variant] }}>
          {children}
        </button>
      );
    }

    function Card({ children }) {
      return (
        <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 20, padding: 28, marginTop: 20 }}>
          {children}
        </div>
      );
    }

    function App() {
      const [view, setView] = useState("home");
      const [guess, setGuess] = useState(6000);

      return (
        <div style={{ minHeight: "100vh", background: C.bg, color: C.text }}>
          <header style={{ display: "flex", justifyContent: "space-between", padding: "18px 32px", borderBottom: `1px solid ${C.border}` }}>
            <div onClick={() => setView("home")} style={{ cursor: "pointer", fontWeight: 700, fontSize: 18 }}>
              🧮 Life Calculator
            </div>
            <div style={{ display: "flex", gap: 15 }}>
              <span>🔥 3</span>
              <span>⭐ 120 XP</span>
            </div>
          </header>

          <main style={{ maxWidth: 800, margin: "40px auto", padding: "0 20px" }}>
            {view === "home" ? (
              <div style={{ textAlign: "center" }}>
                <h1 style={{ fontSize: 44, fontWeight: 700 }}>Can you calculate real life?</h1>
                <p style={{ color: C.muted, fontSize: 18, marginTop: 10 }}>Money, negotiations and everyday decisions turned into a game.</p>
                <div style={{ marginTop: 24 }}>
                  <Button variant="amber" onClick={() => setView("salary")}>Start Salary Challenge ➡️</Button>
                </div>
              </div>
            ) : (
              <Card>
                <Button variant="ghost" onClick={() => setView("home")}>⬅️ Back</Button>
                <h2 style={{ fontSize: 24, marginTop: 15 }}>💰 Salary Challenge</h2>
                <p style={{ color: C.muted }}>How much does Alex (Software Engineer, Berlin) earn?</p>
                
                <div style={{ margin: "30px 0", textAlign: "center" }}>
                  <div style={{ fontSize: 36, fontWeight: 700, color: C.amber }}>${guess.toLocaleString()}</div>
                  <input 
                    type="range" min="3000" max="10000" step="100" value={guess} 
                    onChange={(e) => setGuess(Number(e.target.value))}
                    style={{ width: "100%", marginTop: 15, accentColor: C.amber }}
                  />
                </div>

                <Button variant="amber" onClick={() => alert("Correct range: $5,400 - $6,600!")} style={{ width: "100%" }}>
                  🔒 Lock In My Guess
                </Button>
              </Card>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
