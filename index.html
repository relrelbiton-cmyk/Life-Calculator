    /* ---------------------------------------------------------
       SCORING HELPERS
    --------------------------------------------------------- */
    function scoreFromRange(guess, [lo, hi]) {
      if (guess >= lo && guess <= hi) {
        const mid = (lo + hi) / 2;
        const halfWidth = (hi - lo) / 2 || 1;
        const distFromMid = Math.abs(guess - mid) / halfWidth;
        return Math.round(100 - distFromMid * 15);
      }
      const edge = guess < lo ? lo : hi;
      const distance = Math.abs(guess - edge);
      const pctOff = distance / edge;
      const score = 84 - pctOff * 180;
      return Math.max(0, Math.round(score));
    }

    function verdictForScore(score) {
      if (score >= 90) return { label: "Scary accurate.", color: C.green };
      if (score >= 75) return { label: "Excellent guess.", color: C.green };
      if (score >= 55) return { label: "Pretty solid.", color: C.amber };
      if (score >= 35) return { label: "Not far off.", color: C.amber };
      return { label: "Bold guess. Wrong, but bold.", color: C.red };
    }

    /* ---------------------------------------------------------

    function Badge({ children, tone = "blue" }) {

        </span>
      );
    }

    function BigNumber({ value, size = 40, color = C.text }) {
      return (

    function Button({ children, onClick, variant = "primary", style = {} }) {

        amber: { background: C.amber, color: "#1A1200" },
        ghost: { background: "transparent", color: C.text, border: `1px solid ${C.border}` },
      };
      return (
        <button onClick={onClick} style={{ ...base, ...variants[variant], ...style }}>
          {children}
        </button>
      );
    }

    function Card({ children, style = {} }) {
      return (

    function FactRow({ emoji, label, value }) {

    function GuessSlider({ min, max, step, value, onChange, format }) {
